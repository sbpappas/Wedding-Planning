<title>Our Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">The wedding of</div>
      <h1 id="names">Alejandra <em>&amp;</em> Samuel</h1>
      <div class="when" id="when">Date not set yet</div>
    </div>
    <div class="count" id="count"></div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="basics">Big decisions</button>
    <button role="tab" data-tab="priorities">Our priorities</button>
    <button role="tab" data-tab="tasks">Timeline<span class="n" id="n-tasks"></span></button>
    <button role="tab" data-tab="budget">Budget</button>
    <button role="tab" data-tab="vendors">Vendors<span class="n" id="n-vendors"></span></button>
    <button role="tab" data-tab="ideas">Ideas<span class="n" id="n-ideas"></span></button>
  </nav>

  <div id="notice"></div>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script src="app.js"></script>
